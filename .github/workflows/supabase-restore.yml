# Keeps the Supabase project from pausing for inactivity (daily query), restores it if it is
# already paused, and configures auth redirect URLs.
# Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: Supabase keep-alive / restore

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Restore Supabase project if paused
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}"
          AUTH=(-H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json")

          STATUS=$(curl -sS "${AUTH[@]}" "$API" | jq -r '.status // "unknown"')
          echo "Project status: ${STATUS}"

          if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "PAUSED" ]; then
            echo "Restoring paused Supabase project..."
            curl -sS -X POST "${AUTH[@]}" "${API}/restore"
          fi

          for attempt in $(seq 1 36); do
            STATUS=$(curl -sS "${AUTH[@]}" "$API" | jq -r '.status // "unknown"')
            HEALTH=$(curl -sS -o /dev/null -w "%{http_code}" "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/health" || true)
            echo "Attempt ${attempt}: status=${STATUS}, auth_health=${HEALTH}"
            if [ "$HEALTH" = "200" ] || [ "$HEALTH" = "204" ] || [ "$HEALTH" = "401" ]; then
              echo "Supabase auth is reachable."
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "ERROR: Supabase auth still not healthy after waiting."
              exit 1
            fi
            sleep 10
          done

      - name: Configure auth URLs for password reset
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            -d '{
              "site_url": "https://saimenterprise.com",
              "uri_allow_list": "https://saimenterprise.com/admin/reset-password,http://localhost:8080/admin/reset-password"
            }'
          echo "Auth redirect URLs configured."

      # Free-tier projects pause after a week without database activity; a real query counts.
      - name: Keep-alive query
        run: |
          set -euo pipefail
          # The REST API can lag a few minutes behind auth right after a restore, so retry.
          for attempt in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
              "${VITE_SUPABASE_URL}/rest/v1/categories?select=id&limit=1" || true)
            echo "Attempt ${attempt}: keep-alive query HTTP ${CODE}"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: keep-alive query failed."
          exit 1
